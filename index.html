<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0d0d">
<meta name="description" content="Partidos de CS2 en vivo, calendario y predicciones basadas en la forma reciente de cada equipo. Datos de PandaScore.">
<title>CS2STATS · Partidos y predicciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="#/partidos">CS2<em>STATS</em></a>
    <nav class="tabs" aria-label="Secciones">
      <a class="tab" href="#/partidos" data-route="partidos">Partidos</a>
      <a class="tab" href="#/calendario" data-route="calendario">Calendario</a>
      <a class="tab" href="#/equipos" data-route="equipos">Equipos</a>
    </nav>
    <label class="search-bar">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <span class="visually-hidden">Buscar equipo o liga</span>
      <input type="search" id="search-input" placeholder="Buscar equipo o liga..." autocomplete="off">
    </label>
  </div>
</header>

<main id="app" class="container" aria-live="polite" aria-busy="true">
  <noscript><p class="state">Esta página necesita JavaScript para cargar los partidos.</p></noscript>
</main>

<footer class="footer">
  <div class="container">
    Datos de <a href="https://pandascore.co" target="_blank" rel="noopener noreferrer">PandaScore</a>.
    Las predicciones son estimaciones estadísticas con fines demostrativos, no consejos de apuestas.
  </div>
</footer>

<dialog id="modal" class="modal" aria-label="Detalle del partido">
  <button type="button" class="modal-close" data-action="close-modal" aria-label="Cerrar">✕</button>
  <div id="modal-content"></div>
</dialog>

</body>
</html>
